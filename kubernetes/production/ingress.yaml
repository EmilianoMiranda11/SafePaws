apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safepaws-ingress
  namespace: safepaws-prod
spec:
  ingressClassName: traefik
  rules:
    - host: safepaws.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80